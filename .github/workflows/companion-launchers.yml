name: Companion launcher tests

on:
  pull_request:
    paths:
      - 'companion/**'
      - 'downloads/**'
      - 'scripts/build_companion.py'
      - 'tests/test_companion*.py'
      - '.github/workflows/companion-launchers.yml'

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_companion.py tests/test_companion_launchers.py -q
